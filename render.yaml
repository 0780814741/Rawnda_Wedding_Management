# Render Blueprint: one Python web service + one managed PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
# Secrets are NEVER stored here: SECRET_KEY is generated by Render, others are entered in the dashboard (sync: false).
databases:
  - name: wedding-db
    databaseName: wedding
    user: wedding
    plan: basic-256mb        # paid plan so data is not deleted after a trial period; see README for sizing
    region: frankfurt        # keep identical to the web service (private networking); nearest Render region to Rwanda

services:
  - type: web
    name: rwanda-wedding-planner
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Runs after a successful build and BEFORE the new version receives traffic. Additive migrations only (never resets data).
    # If you use a plan without pre-deploy commands, move this line into buildCommand (see README).
    preDeployCommand: python manage.py migrate --noinput && python manage.py createcachetable && python manage.py setup_roles
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString
      - key: SITE_NAME
        value: Rwanda Wedding Planner
      - key: PLATFORM_SERVICE_FEE_BPS     # 500 = 5.00%. PLACEHOLDER: set your real disclosed fee before launch.
        value: "500"
      - key: VENDOR_COMMISSION_BPS        # 0 = none. Set only if vendors have agreed to a commission.
        value: "0"
      - key: CONTINGENCY_BPS
        value: "1000"
      - key: SHOW_DEMO_VENDORS            # keep false in production
        value: "false"
      - key: ALLOWED_HOSTS                # extra hosts / custom domain, comma-separated (the onrender.com host is added automatically)
        sync: false
      - key: CSRF_TRUSTED_ORIGINS         # e.g. https://www.yourdomain.rw (comma-separated)
        sync: false
      - key: OPERATOR_EMAIL               # where new-request alerts are sent
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: PAYMENT_INSTRUCTIONS         # official bank / mobile-money details shown on invoices
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_BACKEND                # set to django.core.mail.backends.smtp.EmailBackend once SMTP is configured
        value: django.core.mail.backends.console.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Persistent media (vendor photos). Without these, image uploads are DISABLED in production.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL          # required for Cloudflare R2 / Backblaze B2 (not for AWS S3)
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN         # public hostname of the bucket / CDN
        sync: false
