{% extends "base.html" %}{% block title %}Create your account{% endblock %}
{% block content %}<div class="card" style="max-width:34rem;margin:2rem auto"><h1 style="margin-top:0">Create your account</h1>
<p class="muted">It takes one minute. Then we guide you through your wedding setup.</p>
<form method="post" data-loading="Creating account…" novalidate>{% csrf_token %}{% include "partials/form.html" %}<button class="btn" type="submit">Create account</button></form>
<p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p></div>{% endblock %}
