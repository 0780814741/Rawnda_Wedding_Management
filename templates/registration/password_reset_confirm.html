{% extends "base.html" %}{% block content %}<div class="card" style="max-width:28rem;margin:2rem auto">{% if validlink %}<h1 style="margin-top:0">Choose a new password</h1><form method="post" novalidate>{% csrf_token %}{% include "partials/form.html" %}<button class="btn" type="submit">Save password</button></form>{% else %}<h1>Link expired</h1><p>This reset link is no longer valid. <a href="{% url 'accounts:password_reset' %}">Request a new one</a>.</p>{% endif %}</div>{% endblock %}
